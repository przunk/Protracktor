  The page is a speaker with a screen, deliberately. Browsing, search and settings stay on the
  phone; this plays a queue it was handed (docs/PLAN_HANDOFF.md §5a).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protracktor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14131a; --surface: #1e1c26; --line: #2f2c3a;
    --text: #e9e6f0; --dim: #a09aae; --accent: #b69cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 18px; }
  .now { padding: 18px; background: var(--surface); border-radius: 12px; margin-bottom: 18px; }
  .title { font-size: 20px; font-weight: 600; margin-bottom: 2px; overflow-wrap: anywhere; }
  .sub { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .transport { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  button {
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font-size: 15px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  button.primary { background: var(--accent); color: #17141f; border-color: var(--accent); font-weight: 600; min-width: 84px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 92px; text-align: right; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 12px; border-radius: 8px; cursor: pointer; display: flex; gap: 10px; }
  li:hover { background: var(--surface); }
  li.playing { background: var(--surface); color: var(--accent); }
  li .n { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 2.2em; }
  li .name { overflow-wrap: anywhere; }
  textarea { width: 100%; height: 110px; background: var(--surface); color: var(--text);
             border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: 12px; }
  .note { color: var(--dim); font-size: 13px; }
  .mono { font-family: ui-monospace, monospace; font-size: 12px; }
  /* White quiet zone included: a code drawn dark-on-dark is not a code. */
  .qr { display: inline-block; background: #fff; padding: 12px; border-radius: 10px; line-height: 0; }
  .qr table { border-collapse: collapse; }
  .qr td { width: 5px; height: 5px; }
  #pair.small .qr { padding: 6px; }
  #pair.small .qr td { width: 3px; height: 3px; }
  .error { color: #ff9b9b; }
  footer { padding: 10px 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header><h1>Protracktor</h1></header>
<main>
  <section class="now">
    <div class="title" id="title">Nothing playing</div>
    <div class="sub" id="sub">Paste module URLs below, or open a link with a queue in it.</div>
    <div class="transport">
      <button id="prev" disabled>◀◀</button>
      <button id="playpause" class="primary" disabled>Play</button>
      <button id="next" disabled>▶▶</button>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
    <div class="sub error" id="error"></div>
  </section>

  <ol id="queue"></ol>

  <section id="pair">
    <p class="note" id="pairnote">Scan this with Protracktor on your phone to send it a playlist.</p>
    <div id="qr" class="qr"></div>
    <p class="note mono" id="pairurl"></p>
  </section>

  <section id="paste">
    <p class="note">One URL per line. Modland, ASMA and HVSC all allow a browser to read them directly.</p>
    <textarea id="urls" spellcheck="false"></textarea>
    <p><button id="load">Load these</button></p>
  </section>
</main>
<footer id="status">starting…</footer>
<script src="../lib/qrcode.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
