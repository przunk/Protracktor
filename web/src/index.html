<!doctype html>
<!--

  The page, dressed as the app (GOAL.md round 7).

  **The colours are the owner's, sampled rather than guessed.** His phone runs dynamic colour, so it
  does not show the Material 3 baseline at all: the scheme below was read out of two screenshots he
  supplied, pixel by pixel — `docs/reference/app-colours.json` records where each one was taken from.
  A browser cannot read a wallpaper, so everyone sees his scheme; that is the honest cost of looking
  like his app rather than like a generic Material page.

  The structure follows the app screen for screen: a top bar of labelled actions, a list of rows that
  are index-title-subtitle, and a dock that is a seek row, a now-playing card and the transport.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protracktor</title>
<style>
  :root {
    color-scheme: dark;
    /* Sampled from the owner's screenshots, 2026-09-09. See docs/reference/app-colours.json. */
    --bg: #180523;
    --surface-container: #2D133C;
    --secondary-container: #622B80;
    --on-secondary-container: #F5DDFD;
    --primary: #EE83ED;
    --on-primary: #3B0B3A;
    --primary-container: #E9C1FB;
    --on-surface: #F5DDFD;
    --on-surface-variant: #BCA0C7;
    --surface-variant: #3F274C;
    --outline: #8E4B92;
    --error: #FF9B9B;

    /* Material's own shapes, which is most of why a Material screen reads as one. */
    --shape-s: 8px;
    --shape-m: 12px;
    --shape-l: 16px;
    --shape-xl: 28px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--on-surface);
    font: 400 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }

  /* A phone-shaped column rather than a stretched page: the app's proportions are the point, and
     a 74-pixel row across 2,000 pixels of monitor is not the same object. */
  .app {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* --- top bar ------------------------------------------------------------------------------ */

  header {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 12px 12px 8px;
  }
  .playlist {
    background: var(--surface-container);
    border-radius: var(--shape-m);
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  .playlist .name { font-size: 20px; font-weight: 500; letter-spacing: .1px; }
  .playlist .count { font-size: 13px; color: var(--on-surface-variant); margin-top: 1px; }
  .spacer { flex: 1; }

  /* The owner asked for this shape twice (BACKLOG A16, A17, A23): an icon with its name underneath,
     because an icon alone does not say where it goes and a word alone does not read as a control. */
  .action {
    background: var(--secondary-container);
    color: var(--on-secondary-container);
    border: 0;
    border-radius: var(--shape-m);
    min-width: 62px;
    padding: 8px 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .action:hover { filter: brightness(1.12); }
  .action[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
  .action svg { width: 22px; height: 22px; fill: currentColor; }

  /* --- the list ----------------------------------------------------------------------------- */

  main { flex: 1; overflow-y: auto; padding: 4px 0 8px; scrollbar-color: var(--outline) transparent; }
  ol { list-style: none; margin: 0; padding: 0; }
  li.track {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    cursor: pointer;
  }
  li.track:hover { background: color-mix(in srgb, var(--surface-container) 55%, transparent); }
  li.track .n {
    color: var(--on-surface-variant);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    min-width: 22px;
    text-align: right;
  }
  li.track .text { min-width: 0; flex: 1; }
  li.track .title {
    font-size: 17px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  li.track .meta {
    font-size: 14px;
    color: var(--on-surface-variant);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  li.track.playing .title { color: var(--primary); }
  li.track.playing .n { color: var(--primary); }

  /* --- panels ------------------------------------------------------------------------------- */

  .panel { padding: 10px 18px 18px; }
  .panel[hidden] { display: none; }
  .note { color: var(--on-surface-variant); font-size: 13px; margin: 0 0 10px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  /* A code drawn dark on dark is not a code; the quiet zone is part of the specification. */
  .qr { display: inline-block; background: #fff; padding: 12px; border-radius: var(--shape-m); line-height: 0; }
  .qr table { border-collapse: collapse; }
  .qr td { width: 5px; height: 5px; }
  textarea {
    width: 100%; height: 110px;
    background: var(--surface-container);
    color: var(--on-surface);
    border: 1px solid var(--surface-variant);
    border-radius: var(--shape-m);
    padding: 10px;
    font-family: ui-monospace, monospace; font-size: 12px;
  }
  .filled {
    background: var(--primary); color: var(--on-primary);
    border: 0; border-radius: var(--shape-xl);
    padding: 10px 22px; font: inherit; font-weight: 500; cursor: pointer;
    margin-top: 10px;
  }

  /* --- the dock ----------------------------------------------------------------------------- */

  footer { padding: 0 0 10px; }
  .seekrow {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 18px 2px;
    font-size: 13px; color: var(--on-surface-variant);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] {
    flex: 1; appearance: none; background: transparent; height: 20px; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--surface-variant); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface-variant); }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--primary); margin-top: -5px;
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--primary); }
  input[type=range]:disabled::-webkit-slider-thumb { background: var(--surface-variant); }

  .nowcard {
    margin: 4px 12px 0;
    background: var(--surface-container);
    border-radius: var(--shape-l);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .nowcard .text { min-width: 0; flex: 1; }
  .nowcard .title { font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowcard .meta { font-size: 14px; color: var(--on-surface-variant); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nowcard svg { width: 22px; height: 22px; fill: var(--on-surface-variant); flex: none; }

  .transport {
    display: flex; align-items: center; justify-content: space-evenly;
    padding: 10px 12px 2px;
  }
  .tbutton {
    background: none; border: 0; padding: 0; cursor: pointer;
    width: 48px; height: 48px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--on-surface);
  }
  .tbutton:hover:not(:disabled) { background: color-mix(in srgb, var(--on-surface) 10%, transparent); }
  .tbutton:disabled { color: color-mix(in srgb, var(--on-surface) 38%, transparent); cursor: default; }
  .tbutton svg { width: 26px; height: 26px; fill: currentColor; }
  .tbutton.play {
    width: 64px; height: 64px;
    background: var(--primary); color: var(--on-primary);
  }
  .tbutton.play:hover { filter: brightness(1.06); background: var(--primary); }
  .tbutton.play svg { width: 34px; height: 34px; }
  .tbutton.on { color: var(--primary); }

  .statusline {
    padding: 6px 18px 0;
    color: var(--on-surface-variant); font-size: 12px;
    overflow-wrap: anywhere;
  }
  .error { color: var(--error); }

  /* Now Playing: a label above its value, the way the phone's information panel reads. */
  dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; }
  dt { color: var(--on-surface-variant); font-size: 13px; }
  dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  .subsongs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .subsong {
    background: var(--surface-container); color: var(--on-surface);
    border: 1px solid var(--surface-variant); border-radius: var(--shape-s);
    min-width: 40px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .subsong[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="playlist">
      <div class="name">Queue</div>
      <div class="count" id="count">nothing yet</div>
    </div>
    <div class="spacer"></div>
    <button class="action" id="tab-pair" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm-2 16h8v-8H3v8zm2-6h4v4H5v-4zm8-12v8h8V3h-8zm6 6h-4V5h4v4zm0 10h2v2h-2v-2zm-6-6h2v2h-2v-2zm2 2h2v2h-2v-2zm-2 2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h2v2h-2v-2zm0-4h2v2h-2v-2zm2 2h2v2h-2v-2z"/></svg>
      Pair
    </button>
    <button class="action" id="tab-paste" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0 5 5 5h-3v4h-4v-4H7l5-5z"/></svg>
      Paste
    </button>
  </header>

  <main>
    <ol id="queue"></ol>

    <section class="panel" id="pair">
      <p class="note" id="pairnote">Scan this with Protracktor on your phone to send it a playlist.</p>
      <div id="qr" class="qr"></div>
      <p class="note mono" id="pairurl"></p>
    </section>

    <!--
      Now Playing, which on the phone expands upward from the dock over the playlist
      (`ui/NowPlaying.kt`). Here it is a panel under the queue with the same fields in the same
      order, because the point is the information rather than the animation.
    -->
    <section class="panel" id="nowplaying" hidden>
      <dl id="fields"></dl>
      <div id="subsongs" class="subsongs"></div>
    </section>

    <section class="panel" id="paste" hidden>
      <p class="note">One URL per line. Modland, ASMA and HVSC all allow a browser to read them directly.</p>
      <textarea id="urls" spellcheck="false"></textarea>
      <p><button class="filled" id="load">Load these</button></p>
    </section>
  </main>

  <footer>
    <div class="statusline" id="status">starting…</div>
    <div class="statusline error" id="error"></div>

    <div class="seekrow">
      <span id="elapsed">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="Position">
      <span id="remaining">0:00</span>
    </div>

    <div class="nowcard" id="nowcard">
      <div class="text">
        <div class="title" id="title">Nothing playing</div>
        <div class="meta" id="sub">Scan the code with your phone, or paste some URLs</div>
      </div>
      <svg viewBox="0 0 24 24" id="expand"><path d="m7.4 15.4-1.4-1.4 6-6 6 6-1.4 1.4-4.6-4.6z"/></svg>
    </div>

    <div class="transport">
      <button class="tbutton" id="shuffle" title="Shuffle" disabled>
        <svg viewBox="0 0 24 24"><path d="M10.6 8.6 7 5H3v2h3.2l3 3 1.4-1.4zM14 5v2h2.6l-9 9H3v2h5.4l9.6-9.6V13h2V5h-6zm2.6 12H14v2h6v-6h-2v2.6l-3-3-1.4 1.4 3 3z"/></svg>
      </button>
      <button class="tbutton" id="prev" title="Previous" disabled>
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="tbutton play" id="playpause" title="Play" disabled>
        <svg viewBox="0 0 24 24" id="playglyph"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="tbutton" id="next" title="Next" disabled>
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-2.5 6L5 6v12z"/></svg>
      </button>
      <button class="tbutton" id="repeat" title="Repeat" disabled>
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
  </footer>

</div>
<script src="../lib/qrcode.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
